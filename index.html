<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carro em Realidade Aumentada</title>

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px 20px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        p {
            margin: 0;
            color: #aaa;
        }

        model-viewer {
            width: 100%;
            height: 70vh;
            background: #222;
        }

        #ar-button {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            border: 0;
            border-radius: 12px;

            padding: 16px 25px;

            background: white;
            color: black;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        #status {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Veja o carro em tamanho real</h1>

        <p>
            Gire o modelo ou coloque-o no seu ambiente.
        </p>

        <div id="status">
            Carregando modelo...
        </div>
    </header>

    <model-viewer
        id="carro"

        src="./carro.glb"

        alt="Carro em 3D"

        ar

        ar-modes="scene-viewer quick-look webxr"

        camera-controls

        touch-action="pan-y"

        shadow-intensity="1"

        environment-image="neutral"

        exposure="1"

        camera-orbit="0deg 75deg 105%"

        min-camera-orbit="auto auto auto"

        max-camera-orbit="auto auto auto"

        scale="1 1 1"
    >

        <button
            slot="ar-button"
            id="ar-button"
        >
            📱 Ver em realidade aumentada
        </button>

    </model-viewer>


    <script>

        const modelo = document.getElementById("carro");
        const status = document.getElementById("status");

        modelo.addEventListener("load", () => {
            status.textContent = "Modelo carregado ✓";
        });

        modelo.addEventListener("error", (erro) => {
            status.textContent = "Erro ao carregar o modelo.";
            console.error("Erro:", erro);
        });

        modelo.addEventListener("ar-status", (event) => {

            console.log("Status AR:", event.detail.status);

            if (event.detail.status === "session-started") {
                status.textContent = "Realidade aumentada ativada ✓";
            }

            if (event.detail.status === "not-presenting") {
                status.textContent = "Modo AR encerrado.";
            }

            if (event.detail.status === "failed") {
                status.textContent =
                    "Não foi possível iniciar a realidade aumentada.";
            }

        });

    </script>

</body>
</html>
